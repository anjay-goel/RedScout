name: Go

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    if: contains(github.event.head_commit.message, '#deploy')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up release version
        id: vars
        run: echo "VERSION=$(date +v%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GOOS=${target%-*} GOARCH=${target#*-} CGO_ENABLED=0 go build -o dist/redscout-$target
          done
          cd dist && sha256sum redscout-* > checksums.txt

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.vars.outputs.VERSION }}
          git push origin ${{ steps.vars.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: Release ${{ steps.vars.outputs.VERSION }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
